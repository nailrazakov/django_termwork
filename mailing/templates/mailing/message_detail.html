{% extends 'mailing/base.html' %}
{% block title %}Клиенты сервиса{% endblock %}
{% block content %}

    <main class="main-content">
        <hr>
     <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Получатель {{ object.fio }}</h1>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Назад к списку
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Основная информация</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <tbody>
                        <tr>
                            <th class="w-25">ID</th>
                            <td>{{ object.id }}</td>
                        </tr>
                        <tr>
                            <th>Тема письма</th>
                            <td>{{ object.subject }}</td>
                        </tr>

                        <tr>
                            <th>Содержание</th>
                            <td>{{ object.body }}</td>
                        </tr>


                    </tbody>
                </table>
            </div>
        </div>
    </div>



    <!-- Кнопки действий -->
    <div class="mt-4">
       <div class="btn-group">
           <a href="{% url 'mailing:message_update' object.pk %}" class="btn btn-outline-primary">Редактировать</a>
           <a href="{% url 'mailing:message_delete' object.pk %}" class="btn btn-outline-danger">Удалить</a>
           <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-secondary">Назад</a>
       </div>
    </div>
</div>




                </tbody>
            </table>
        </div>
    </main>

{% endblock %}
